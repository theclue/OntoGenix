version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 8
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    allow:
      - dependency-type: "all"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 8
    open-pull-requests-limit: 10
    labels: ["dependencies", "github-actions"]
