name: CI Build and Supply Chain Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify git commit SHA integrity
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Verify dependency pins and manifests
        run: python supply_chain_verify.py --verify-manifests
      - name: Install build backend dependencies
        run: python -m pip install --require-hashes -r build-requirements.txt
      - name: Run unit and contract tests
        run: python -m unittest discover -v -s . -p "test_*.py"
      - name: Build packages and verify checksums
        run: |
          python supply_chain_verify.py --build-and-verify dist
          python supply_chain_verify.py --verify-dist dist
          (cd dist && sha256sum --check CHECKSUMS.sha256 && md5sum --check CHECKSUMS.md5)
      - name: Upload built packages and trust files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.md5
            dist/*.sha256
            dist/CHECKSUMS.md5
            dist/CHECKSUMS.sha256
