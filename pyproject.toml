[build-system]
requires = ["packaging==26.3", "setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ontogenix"
version = "1.2"
description = "Ontology design and knowledge graph generation assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Marco S. Nobile" },
    { name = "Matteoessori" },
]
dependencies = [
    "beautifulsoup4==4.15.0",
    "chardet==5.2.0",
    "lxml==6.1.3",
    "markdown==3.10.3",
    "matplotlib==3.7.1",
    "morph-kgc==2.10.0",
    "networkx==3.6.1",
    "nltk==3.10.4",
    "numpy==2.2.6",
    "openai==3.35.1",
    "pandas==2.0.2",
    "Pillow==13.0.0",
    "plantuml==0.3.0",
    "PyQt5==5.15.11",
    "python-dotenv==1.2.4",
    "pyvis==0.3.2",
    "pyyaml==6.0.3",
    "rdflib==7.6.0",
    "requests==2.34.2",
    "scikit-learn==1.7.2",
    "sentence_transformers==6.1.0",
    "serpapi==1.1.2",
    "setuptools==84.2.1",
    "wordcloud==1.9.6",
]

[tool.setuptools]
py-modules = ["headless", "supply_chain_verify"]

[tool.setuptools.packages.find]
include = ["GUI", "GUI.*"]
namespaces = true
